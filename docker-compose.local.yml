services:
  postgres:
    image: postgres:15-alpine
    container_name: matefield_db_local
    environment:
      POSTGRES_USER: matefield_user
      POSTGRES_PASSWORD: matefield_password
      POSTGRES_DB: matefield_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matefield_user -d matefield_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - matefield_local_net

  mock_rcon_1:
    build:
      context: .
      dockerfile: apps/rcon_mock/Dockerfile
    container_name: mock_rcon_1
    ports:
      - "7776:7776"
    networks:
      matefield_local_net:
        aliases:
          - mock-rcon

  mock_rcon_2:
    build:
      context: .
      dockerfile: apps/rcon_mock/Dockerfile
    container_name: mock_rcon_2
    ports:
      - "7777:7776"
    networks:
      - matefield_local_net

  mock_rcon_3:
    build:
      context: .
      dockerfile: apps/rcon_mock/Dockerfile
    container_name: mock_rcon_3
    ports:
      - "7778:7776"
    networks:
      - matefield_local_net

  api_rcon:
    build:
      context: .
      dockerfile: apps/api_rcon/Dockerfile
    container_name: api_rcon_local
    working_dir: /app/apps/api_rcon
    env_file: .env.local
    environment:
      - UV_PROJECT_ENVIRONMENT=/app/.venv
    command: sh -c "uv run alembic upgrade head && uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./apps/api_rcon:/app/apps/api_rcon
      - ./packages:/app/packages
    ports:
      - "8000:8000"
    networks:
      - matefield_local_net
    depends_on:
      postgres:
        condition: service_healthy

  discord_bot:
    build:
      context: .
      dockerfile: apps/discord_bot/Dockerfile
    container_name: discord_bot_local
    env_file: .env.local
    environment:
      - UV_PROJECT_ENVIRONMENT=/app/.venv
    working_dir: /app/apps/discord_bot
    command: sh -c "uv run python -m src.main"
    volumes:
      - ./apps/discord_bot:/app/apps/discord_bot
      - ./packages:/app/packages
    networks:
      - matefield_local_net
    depends_on:
      - api_rcon

networks:
  matefield_local_net:
    driver: bridge

volumes:
  pgdata_local:
